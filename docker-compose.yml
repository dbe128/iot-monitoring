services:
  postgresql:
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: monitoring
      POSTGRES_USER: monitoring_user
      POSTGRES_PASSWORD: IOT123!
    ports:
     - "5432:5432"

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"


volumes:
  postgres_data: